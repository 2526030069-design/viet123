<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sức Khỏe Vàng - Dinh Dưỡng & Thiết Bị Y Tế</title>
    <style>
        :root {
            --primary: #10b981;
            --primary-dark: #047857;
            --secondary: #0284c7;
            --dark: #1f2937;
            --light: #f9fafb;
            --text: #4b5563;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background-color: #f3f4f6;
            color: var(--dark);
        }

        /* Topbar & Header */
        .topbar {
            background: var(--dark);
            color: white;
            font-size: 13px;
            text-align: center;
            padding: 6px 0;
        }

        header {
            background: white;
            padding: 15px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            z-index: 100;
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            color: var(--primary);
            text-decoration: none;
        }
        .logo span { color: var(--secondary); }

        /* Bộ lọc danh mục (Filter) */
        .filter-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 30px 0;
        }

        .filter-btn {
            background: white;
            border: 1px solid #e5e7eb;
            padding: 10px 20px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
            color: var(--text);
            transition: all 0.3s;
        }

        .filter-btn.active, .filter-btn:hover {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        /* Khu vực hiển thị chính */
        .main-layout {
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 30px;
            max-width: 1300px;
            margin: 0 auto;
            padding: 0 20px 60px;
        }

        /* Grid sản phẩm */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
        }

        .card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            border: 1px solid #f3f4f6;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card-img {
            height: 180px;
            background: #f9fafb;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
        }

        .card-body {
            padding: 15px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .badge {
            font-size: 11px;
            font-weight: bold;
            padding: 3px 8px;
            border-radius: 5px;
            align-self: flex-start;
            margin-bottom: 8px;
        }
        .badge.dinh-duong { background: #d1fae5; color: var(--primary-dark); }
        .badge.thiet-bi { background: #e0f2fe; color: var(--secondary); }

        .title {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 8px;
            line-height: 1.4;
            height: 42px;
            overflow: hidden;
        }

        .price {
            font-size: 18px;
            font-weight: 700;
            color: #ef4444;
            margin-top: auto;
            margin-bottom: 12px;
        }

        .add-btn {
            background: var(--dark);
            color: white;
            border: none;
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .add-btn:hover { background: var(--primary); }

        /* Khối Giỏ Hàng Bên Phải */
        .cart-sidebar {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            height: fit-content;
            position: sticky;
            top: 90px;
        }

        .cart-title {
            font-size: 18px;
            border-bottom: 2px solid #f3f4f6;
            padding-bottom: 10px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
        }

        .cart-items {
            max-height: 300px;
            overflow-y: auto;
            margin-bottom: 15px;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 1px dashed #f3f4f6;
        }

        .cart-total {
            font-size: 16px;
            font-weight: 700;
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 2px solid #f3f4f6;
        }

        .checkout-btn {
            background: #ef4444;
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-weight: 700;
            margin-top: 15px;
            cursor: pointer;
        }
        .checkout-btn:hover { background: #dc2626; }

        /* Responsive */
        @media (max-width: 900px) {
            .main-layout { grid-template-columns: 1fr; }
            .cart-sidebar { position: static; }
        }
    </style>
</head>
<body>

    <div class="topbar">⚡ MIỄN PHÍ VẬN CHUYỂN TOÀN QUỐC CHO ĐƠN HÀNG THIẾT BỊ Y TẾ TỪ 1 TRIỆU ĐỒNG ⚡</div>

    <header>
        <a href="#" class="logo">SứcKhỏe<span>Vàng</span></a>
        <div style="font-weight: 600; color: var(--text);">Hotline: 1800.6789</div>
    </header>

    <!-- Bộ lọc nhanh -->
    <div class="filter-container">
        <button class="filter-btn active" onclick="filterCategory('all', this)">Tất Cả Sản Phẩm</button>
        <button class="filter-btn" onclick="filterCategory('nutrition', this)">Thực Phẩm Dinh Dưỡng</button>
        <button class="filter-btn" onclick="filterCategory('medical', this)">Thiết Bị Y Tế</button>
    </div>

    <!-- Layout chia làm 2 cột -->
    <div class="main-layout">
        
        <!-- Cột trái: Danh sách sản phẩm -->
        <div class="product-grid" id="productContainer">
            <!-- Sản phẩm sẽ được hiển thị bằng Javascript ở dưới -->
        </div>

        <!-- Cột phải: Giỏ hàng tính tiền tự động -->
        <div class="cart-sidebar">
            <div class="cart-title">
                <span>Giỏ Hàng Của Bạn</span>
                <span id="cartCount" style="color: var(--primary);">0</span>
            </div>
            <div class="cart-items" id="cartItems">
                <p style="color:#9ca3af; text-align:center; padding: 20px 0;">Chưa có sản phẩm nào.</p>
            </div>
            <div class="cart-total">
                <span>Tổng tiền:</span>
                <span id="cartTotal" style="color: #ef4444;">0 đ</span>
            </div>
            <button class="checkout-btn" onclick="checkout()">TIẾN HÀNH ĐẶT HÀNG</button>
        </div>
    </div>

    <script>
        // Cơ sở dữ liệu sản phẩm mẫu (Bạn có thể tự sửa tên/giá/icon ở đây)
        const products = [
            { id: 1, name: "Hồng Sâm Lát Tẩm Mật Ong Hàn Quốc", price: 850000, cat: "nutrition", type: "Dinh Dưỡng", icon: "🪵" },
            { id: 2, name: "Yến Sào Khánh Hòa Tinh Chế Thượng Hạng", price: 3600000, cat: "nutrition", type: "Dinh Dưỡng", icon: "🪹" },
            { id: 3, name: "Viên Uống Bổ Não Ginkgo Biloba 120mg", price: 420000, cat: "nutrition", type: "Dinh Dưỡng", icon: "🧠" },
            { id: 4, name: "Nước Cốt Sâm Dây Ngọc Linh Nguyên Chất", price: 1200000, cat: "nutrition", type: "Dinh Dưỡng", icon: "🧪" },
            { id: 5, name: "Máy Đo Huyết Áp Bắp Tay Tự Động Omron", price: 1050000, cat: "medical", type: "Thiết Bị Y Tế", icon: "📟" },
            { id: 6, name: "Máy Xông Khí Dung Mũi Họng Nén Khí", price: 680000, cat: "medical", type: "Thiết Bị Y Tế", icon: "🌬️" },
            { id: 7, name: "Hộp Sơ Cứu Y Tế Gia Đình Khẩn Cấp (Nhỏ Gọn)", price: 240000, cat: "medical", type: "Thiết Bị Y Tế", icon: "📦" },
            { id: 8, name: "Máy Đo Đường Huyết Sinocare Chính Xác", price: 380000, cat: "medical", type: "Thiết Bị Y Tế", icon: "🩸" }
        ];

        let cart = [];

        // Hàm render sản phẩm ra màn hình
        function renderProducts(data) {
            const container = document.getElementById('productContainer');
            container.innerHTML = '';
            data.forEach(p => {
                container.innerHTML += `
                    <div class="card">
                        <div class="card-img">${p.icon}</div>
                        <div class="card-body">
                            <span class="badge ${p.cat === 'nutrition' ? 'dinh-duong' : 'thiet-bi'}">${p.type}</span>
                            <div class="title">${p.name}</div>
                            <div class="price">${p.price.toLocaleString('vi-VN')} đ</div>
                            <button class="add-btn" onclick="addToCart(${p.id})">Thêm vào giỏ</button>
                        </div>
                    </div>
                `;
            });
        }

        // Hàm lọc danh mục
        function filterCategory(category, btn) {
            // Đổi active button
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            // Lọc dữ liệu
            if(category === 'all') {
                renderProducts(products);
            } else {
                const filtered = products.filter(p => p.cat === category);
                renderProducts(filtered);
            }
        }

        // Hàm thêm vào giỏ hàng
        function addToCart(id) {
            const product = products.find(p => p.id === id);
            const exist = cart.find(item => item.id === id);

            if(exist) {
                exist.quantity += 1;
            } else {
                cart.push({...product, quantity: 1});
            }
            updateCart();
        }

        // Hàm cập nhật trạng thái giỏ hàng
        function updateCart() {
            const cartItems = document.getElementById('cartItems');
            const cartTotal = document.getElementById('cartTotal');
            const cartCount = document.getElementById('cartCount');

            if(cart.length === 0) {
                cartItems.innerHTML = `<p style="color:#9ca3af; text-align:center; padding: 20px 0;">Chưa có sản phẩm nào.</p>`;
                cartTotal.innerText = '0 đ';
                cartCount.innerText = '0';
                return;
            }

            cartItems.innerHTML = '';
            let total = 0;
            let count = 0;

            cart.forEach(item => {
                total += item.price * item.quantity;
                count += item.quantity;
                cartItems.innerHTML += `
                    <div class="cart-item">
                        <div>
                            <div style="font-weight:600;">${item.name}</div>
                            <div style="color:var(--text); font-size:12px;">${item.price.toLocaleString('vi-VN')} đ x ${item.quantity}</div>
                        </div>
                        <button onclick="removeFromCart(${item.id})" style="background:none; border:none; color:#ef4444; cursor:pointer; font-weight:bold;">Xóa</button>
                    </div>
                `;
            });

            cartTotal.innerText = total.toLocaleString('vi-VN') + ' đ';
            cartCount.innerText = count;
        }

        // Hàm xóa sản phẩm khỏi giỏ
        function removeFromCart(id) {
            cart = cart.filter(item => item.id !== id);
            updateCart();
        }

        // Bấm nút đặt hàng
        function checkout() {
            if(cart.length === 0) {
                alert('Giỏ hàng của bạn đang trống!');
                return;
            }
            alert('Cảm ơn bạn đã trải nghiệm demo! Hệ thống đã ghi nhận đơn hàng giả lập của bạn.');
            cart = [];
            updateCart();
        }

        // Khởi chạy lần đầu tiên
        renderProducts(products);
    </script>
</body>
</html>
